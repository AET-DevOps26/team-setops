openapi: 3.0.3
info:
  title: DevPulse API
  version: 0.1.0
  description: OpenAPI contract for DevPulse services. This file is the single source of truth.
servers:
  - url: http://localhost:8001
    description: Local py-intelligence (docker-compose port binding)
tags:
  - name: Health
  - name: Intelligence
  - name: RAG
  - name: Ingestion
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/analyze:
    post:
      tags: [Intelligence]
      operationId: analyze
      summary: Run the full intelligence pipeline and return a structured result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Structured analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /api/v1/rag/documents:
    post:
      tags: [RAG]
      operationId: createRagDocument
      summary: Create/index a document for retrieval (RAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRagDocumentRequest"
      responses:
        "201":
          description: Document accepted for indexing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagDocument"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /api/v1/rag/documents/{document_id}:
    delete:
      tags: [RAG]
      operationId: deleteRagDocument
      summary: Delete a previously indexed RAG document
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /api/v1/rag/search:
    post:
      tags: [RAG]
      operationId: searchRag
      summary: Search the retrieval store for relevant documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagSearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagSearchResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/logs/deployment:
    post:
      tags: [Ingestion]
      operationId: ingestDeploymentLog
      summary: Ingest a deployment log event
      description: Accepts a deployment log event and publishes it asynchronously via RabbitMQ for processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingLogEventDto"
      responses:
        "202":
          description: Log event accepted for asynchronous processing
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/alerts/system:
    post:
      tags: [ Ingestion ]
      operationId: ingestSystemAlert
      summary: Ingest a system alert event
      description: Accepts a system alert from external monitors (e.g., Prometheus, Datadog) and publishes it asynchronously via RabbitMQ for downstream processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemAlertDto"
      responses:
        "202":
          description: System alert accepted for asynchronous processing
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: py-intelligence
    AnalyzeRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: Raw log/text content to analyze.
        mode:
          type: string
          description: Which inference mode to use.
          enum: [local, cloud]
          default: local
        use_rag:
          type: boolean
          default: false
        context:
          type: string
          nullable: true
          description: Optional additional context from the caller.
    AnalyzeResponse:
      type: object
      required: [problem_type, summary, problem_summary, troubleshoot, solutions]
      properties:
        problem_type:
          type: string
          description: UI tag/category of the detected problem.
          example: database_timeout
        summary:
          type: string
          description: Short overall summary.
        problem_summary:
          type: string
          description: What went wrong / main issue.
        troubleshoot:
          $ref: "#/components/schemas/TroubleshootBlock"
        solutions:
          type: array
          items:
            type: string
          description: Suggested fixes / next steps.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
          description: Optional references used for RAG.
    TroubleshootBlock:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items:
            type: string
          description: Key findings/diagnostics extracted from the input.
        notes:
          type: array
          items:
            type: string
          description: Optional extra notes.
    SourceRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Source identifier (e.g., document id).
        title:
          type: string
        url:
          type: string
    CreateRagDocumentRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
          default: []
    RagDocument:
      type: object
      required: [id, title, content, tags]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
    RagSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
    RagSearchResponse:
      type: object
      required: [results, count]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/RagSearchResult"
        count:
          type: integer
          minimum: 0
    RagSearchResult:
      type: object
      required: [document_id, title, score, snippet]
      properties:
        document_id:
          type: string
        title:
          type: string
        score:
          type: number
          format: float
        snippet:
          type: string
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    IncomingLogEventDto:
      type: object
      required: [serviceName, logContent]
      properties:
        serviceName:
          type: string
          minLength: 1
          description: Name of the service that generated the deployment log
          example: auth-service
        logContent:
          type: string
          minLength: 1
          description: Raw deployment log content to be ingested
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: Optional timestamp of when the log was generated
        severity:
          type: string
          enum: [INFO, WARNING, ERROR, CRITICAL]
          default: INFO
          description: Log severity level
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional key-value metadata associated with the deployment
    SystemAlertDto:
      type: object
      required: [ alertId, source, severity, description, timestamp ]
      properties:
        alertId:
          type: string
          minLength: 1
          description: Unique identifier for the alert
          example: "alert-9912"
        source:
          type: string
          minLength: 1
          description: Source of the alert (e.g., Prometheus, Datadog)
          example: "Prometheus"
        severity:
          type: string
          minLength: 1
          description: Severity level of the alert
          example: "CRITICAL"
        description:
          type: string
          minLength: 1
          description: Detailed description of the alert
          example: "CPU usage on node-1 exceeded 90% for 5 minutes"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of when the alert was fired
        metrics:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional key-value metrics associated with the alert
          example:
            cpu_load: 92.5
            memory_usage: "8GB"


# ============================================================
# RabbitMQ: StatefulSet + Service + PersistentVolumeClaim
# ============================================================
# Same StatefulSet pattern as PostgreSQL — message brokers
# store messages on disk and need stable identity.
#
# RESOURCE BUDGET: 150m CPU / 384Mi memory (requests)
# ============================================================

# ---------- Service (headless) ----------
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: devpulse-prod
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: devpulse
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
      name: tcp-amqp
    - port: 15672
      targetPort: 15672
      name: http-management

---
# ---------- StatefulSet ----------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: devpulse-prod
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: devpulse
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # rabbitmq image runs as uid 999 (rabbitmq user)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      initContainers:
        - name: fix-cookie-permissions
          image: busybox
          command: ['sh', '-c', 'chmod 600 /var/lib/rabbitmq/.erlang.cookie || true']
          securityContext:
            runAsUser: 999
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management-alpine
          ports:
            - containerPort: 5672
              name: tcp-amqp
            - containerPort: 15672
              name: http-management
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              cpu: "300m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
# ---------- Service ----------
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: devpulse-prod
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devpulse
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http

---
# ---------- Deployment ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: devpulse-prod
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devpulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: GF_SERVER_ROOT_URL
              value: "https://team-setops.stud.k8s.aet.cit.tum.de/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: TELEGRAM_CHAT_ID
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /grafana/api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /grafana/api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              cpu: "300m"
              memory: "384Mi"
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: alerting
          configMap:
            name: grafana-alerting
        - name: dashboards
          configMap:
            name: grafana-dashboards

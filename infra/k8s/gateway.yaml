# ============================================================
# gateway: ConfigMap + Deployment + Service (NodePort)
# ============================================================
# RESOURCE BUDGET: 50m CPU / 64Mi memory (requests)
# ============================================================

# ---------- ConfigMap (nginx config files) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
  namespace: setops
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: devpulse
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        server_tokens off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_body_timeout 12s;
        client_header_timeout 12s;
        keepalive_timeout 15s;
        send_timeout 10s;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;

        client_max_body_size 10M;

        access_log /dev/stdout;
        error_log /dev/stderr warn;

        map $http_origin $allow_origin {
            default "";
            "~^https?://localhost(:[0-9]+)?$" "$http_origin";
            "~^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
        }

        server {
            listen 80;

            location /api/v1/logs {
                include /etc/nginx/cors.conf;
                proxy_pass http://spring-ingestion:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/alerts/system {
                include /etc/nginx/cors.conf;
                proxy_pass http://spring-ingestion:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/logbook {
                include /etc/nginx/cors.conf;
                proxy_pass http://spring-logbook:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/alerts {
                include /etc/nginx/cors.conf;
                proxy_pass http://spring-alerts:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/analyze {
                include /etc/nginx/cors.conf;
                proxy_pass http://py-intelligence:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/rag {
                include /etc/nginx/cors.conf;
                proxy_pass http://py-intelligence:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /health {
                include /etc/nginx/cors.conf;
                proxy_pass http://py-intelligence:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
                proxy_pass http://client:3000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }

  cors.conf: |
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $allow_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    add_header 'Access-Control-Allow-Origin' $allow_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

---
# ---------- Service (NodePort) ----------
# NodePort assigns a high port (30080) on every cluster node.
# Access from outside: http://<node-ip>:30080
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: setops
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: devpulse
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http

---
# ---------- Deployment ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: setops
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: devpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          # Mount ConfigMap keys as files inside the container
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/cors.conf
              subPath: cors.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx-config

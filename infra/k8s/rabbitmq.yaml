# ============================================================
# RabbitMQ: StatefulSet + Service + PersistentVolumeClaim
# ============================================================
# Same StatefulSet pattern as PostgreSQL — message brokers
# store messages on disk and need stable identity.
#
# RESOURCE BUDGET: 100m CPU / 256Mi memory (requests)
# ============================================================

# ---------- Service (headless) ----------
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: setops
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: devpulse
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
      name: tcp-amqp
    - port: 15672
      targetPort: 15672
      name: http-management

---
# ---------- StatefulSet ----------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: setops
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: devpulse
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # rabbitmq image runs as uid 999 (rabbitmq user)
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management-alpine
          ports:
            - containerPort: 5672
              name: tcp-amqp
            - containerPort: 15672
              name: http-management
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

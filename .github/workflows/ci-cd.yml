name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
  RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
  RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
  RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  openapi-sync-check:
    name: OpenAPI Client Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Run generation script
        run: |
          chmod +x api/scripts/gen-all.sh
          ./api/scripts/gen-all.sh

      - name: Check for unsynced changes
        run: |
          # If git diff shows changes, it means a developer modified openapi.yaml 
          # but forgot to run gen-all.sh and commit the updated client/src/api.ts.
          echo "Checking if client/src/api.ts is up-to-date with api/openapi.yaml..."
          git diff --exit-code

  spring-services:
    name: Spring services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        serviceDir:
          - services/spring-alerts
          - services/spring-ingestion
          - services/spring-logbook
    defaults:
      run:
        working-directory: ${{ matrix.serviceDir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 21) and Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: "gradle"

      - name: Run Gradle clean, tests and build
        run: ./gradlew :app:clean :app:test :app:build --no-daemon --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.serviceDir }}
          path: app/build/test-results/**

  py-intelligence:
    name: py-intelligence (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/py-intelligence
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/py-intelligence/requirements.txt
            services/py-intelligence/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Black (format check)
        run: black --check .

      - name: Flake8 (lint)
        run: flake8 .

      - name: Pytest
        run: pytest
        env:
          MONGODB_URI: mongodb://localhost:27017
          DB_NAME: test_db
          COLLECTION_NAME: test_collection

  client:
    name: Client (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests (one-shot)
        run: npm run test -- --run

      - name: Build
        run: npm run build

  docker-build-push:
    name: Build and Push Docker images
    runs-on: ubuntu-latest
    needs: [spring-services, py-intelligence, client]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: client
            context: client
            dockerfile: client/Dockerfile
            image: client
          - name: py-intelligence
            context: services/py-intelligence
            dockerfile: services/py-intelligence/Dockerfile
            image: py-intelligence
          - name: spring-alerts
            context: services/spring-alerts
            dockerfile: services/spring-alerts/Dockerfile
            image: spring-alerts
          - name: spring-ingestion
            context: services/spring-ingestion
            dockerfile: services/spring-ingestion/Dockerfile
            image: spring-ingestion
          - name: spring-logbook
            context: services/spring-logbook
            dockerfile: services/spring-logbook/Dockerfile
            image: spring-logbook
          - name: gateway
            context: infra/nginx
            dockerfile: infra/nginx/Dockerfile
            image: gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose -f infra/docker-compose.yml config

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GitHub repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and Push image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.REPO }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.REPO }}/${{ matrix.image }}:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase GitHub repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Generate secrets.yaml
        run: |
          cp infra/k8s/secrets.yaml.template infra/k8s/secrets.yaml
          
          # Replace placeholders with Base64 encoded secrets
          # "-w 0" is used to prevent line wrapping for long secrets

          # PostgreSQL
          sed -i "s|<BASE64_POSTGRES_USER>|$(echo -n '${{ secrets.POSTGRES_USER }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_POSTGRES_PASSWORD>|$(echo -n '${{ secrets.POSTGRES_PASSWORD }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_POSTGRES_URL>|$(echo -n '${{ secrets.POSTGRES_URL }}' | base64 -w 0)|g" infra/k8s/secrets.yaml

          # RabbitMQ
          sed -i "s|<BASE64_RABBITMQ_USER>|$(echo -n '${{ secrets.RABBITMQ_USER }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_RABBITMQ_PASSWORD>|$(echo -n '${{ secrets.RABBITMQ_PASSWORD }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_RABBITMQ_HOST>|$(echo -n '${{ secrets.RABBITMQ_HOST }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_RABBITMQ_PORT>|$(echo -n '${{ secrets.RABBITMQ_PORT }}' | base64 -w 0)|g" infra/k8s/secrets.yaml

          # Python Intelligence / GenAI
          sed -i "s|<BASE64_MONGODB_URI>|$(echo -n '${{ secrets.MONGODB_URI }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_GOOGLE_API_KEY>|$(echo -n '${{ secrets.GOOGLE_API_KEY }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_OPENAI_API_KEY>|$(echo -n '${{ secrets.OPENAI_API_KEY }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_OPENAI_BASE_URL>|$(echo -n '${{ secrets.OPENAI_BASE_URL }}' | base64 -w 0)|g" infra/k8s/secrets.yaml

          # Telegram
          sed -i "s|<BASE64_TELEGRAM_BOT_TOKEN>|$(echo -n '${{ secrets.TELEGRAM_BOT_TOKEN }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_TELEGRAM_CHAT_ID>|$(echo -n '${{ secrets.TELEGRAM_CHAT_ID }}' | base64 -w 0)|g" infra/k8s/secrets.yaml

          # Gateway basic auth (Prometheus route)
          sed -i "s|<BASE64_PROMETHEUS_AUTH_USER>|$(echo -n '${{ secrets.PROMETHEUS_AUTH_USER }}' | base64 -w 0)|g" infra/k8s/secrets.yaml
          sed -i "s|<BASE64_PROMETHEUS_AUTH_PASSWORD>|$(echo -n '${{ secrets.PROMETHEUS_AUTH_PASSWORD }}' | base64 -w 0)|g" infra/k8s/secrets.yaml

      - name: Set Specific Image Tags
        working-directory: infra/k8s
        run: |
          # Use Kustomize to update the image tags to the exact commit SHA we just built
          kustomize edit set image ghcr.io/aet-devops26/team-setops/client=ghcr.io/${{ env.REPO }}/client:${{ github.sha }}
          kustomize edit set image ghcr.io/aet-devops26/team-setops/py-intelligence=ghcr.io/${{ env.REPO }}/py-intelligence:${{ github.sha }}
          kustomize edit set image ghcr.io/aet-devops26/team-setops/spring-alerts=ghcr.io/${{ env.REPO }}/spring-alerts:${{ github.sha }}
          kustomize edit set image ghcr.io/aet-devops26/team-setops/spring-ingestion=ghcr.io/${{ env.REPO }}/spring-ingestion:${{ github.sha }}
          kustomize edit set image ghcr.io/aet-devops26/team-setops/spring-logbook=ghcr.io/${{ env.REPO }}/spring-logbook:${{ github.sha }}
          kustomize edit set image ghcr.io/aet-devops26/team-setops/gateway=ghcr.io/${{ env.REPO }}/gateway:${{ github.sha }}

      - name: Create kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          # Check if the secret is already plain YAML or Base64 encoded
          if echo "$KUBE_CONFIG" | grep -q "apiVersion"; then
            echo "$KUBE_CONFIG" > ~/.kube/config
          else
            echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          # 1. Apply secrets first so they are available for pods
          kubectl apply -f infra/k8s/secrets.yaml

          # 2. Apply everything else. Uses the standalone kustomize CLI since
          # `kubectl apply -k` doesn't support --load-restrictor.
          kustomize build infra/k8s/ --load-restrictor LoadRestrictionsNone | kubectl apply -f -

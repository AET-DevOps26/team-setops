# ============================================================
# Kustomization — one-command deployment
# ============================================================
# This file tells "kubectl apply -k" which manifests to deploy.
#
# Deploy everything:   kubectl apply -k infra/k8s/
# Tear down:           kubectl delete -k infra/k8s/
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devpulse-prod

resources:
  # Infrastructure (deploy first — other services depend on these)
  - postgres.yaml
  - rabbitmq.yaml
  # Application services
  - spring-ingestion.yaml
  - spring-logbook.yaml
  - spring-alerts.yaml
  - py-intelligence.yaml
  - client.yaml
  # Monitoring
  - prometheus.yaml
  - grafana.yaml
  # API gateway (external entry point)
  - gateway.yaml
  # Ingress (team subdomain)
  - ingress.yaml

# Prometheus/Grafana ConfigMaps are generated from
# config files under infra/prometheus/ and infra/grafana/ .
configMapGenerator:
  - name: prometheus-config
    files:
      - ../prometheus/prometheus.yml
      - ../prometheus/alert.rules
  - name: grafana-datasources
    files:
      - ../grafana/provisioning/datasources/datasource.yml
  - name: grafana-dashboards-provider
    files:
      - ../grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-alerting
    files:
      - ../grafana/provisioning/alerting/alerting.yml
  - name: grafana-dashboards
    files:
      - ../grafana/dashboards/devpulse_dashboard.json
      - ../grafana/dashboards/devpulse_resources_dashboard.json
      - ../grafana/dashboards/azure_sizing_dashboard.json

# Common labels applied to ALL resources for easy querying:
#   kubectl get all -n devpulse-prod -l app.kubernetes.io/part-of=devpulse
commonLabels:
  app.kubernetes.io/managed-by: kustomize

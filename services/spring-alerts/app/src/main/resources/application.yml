server:
  port: 8080

spring:
  application:
    name: spring-alerts
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

devpulse:
  rabbitmq:
    exchange: devpulse.exchange
    queue:
      system-alert: devpulse.alerts.system.queue
    routing:
      system-alert: alert.system.received
  alerts:
    thresholds: "{cpu_load: 90.0, memory_usage_percent: 85.0}"

management:
  endpoints:
    web:
      exposure:
        include: "health, prometheus"
  endpoint:
    prometheus:
      enabled: true 
    health:
      show-details: "always"
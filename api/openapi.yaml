openapi: 3.0.3
info:
  title: DevPulse API
  version: 0.1.0
  description: OpenAPI contract for DevPulse services. This file is the single source of truth.
servers:
  - url: http://localhost:8001
    description: Local py-intelligence (docker-compose port binding)
tags:
  - name: Health
  - name: Intelligence
  - name: RAG
  - name: Ingestion
  - name: Alerts
  - name: Logbook
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/analyze:
    post:
      tags: [Intelligence]
      operationId: analyze
      summary: Run the full intelligence pipeline and return a structured result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Structured analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /api/v1/analyses/query:
    post:
      tags: [Intelligence]
      operationId: queryAnalyses
      summary: Fetch previously persisted analyses for a set of log IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysesQueryRequest"
      responses:
        "200":
          description: Map of log_id to persisted analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysesQueryResponse"
  /api/v1/analyses/{log_id}:
    delete:
      tags: [Intelligence]
      operationId: deleteAnalysis
      summary: Remove the persisted analysis for a single log
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /api/v1/analyses:
    delete:
      tags: [Intelligence]
      operationId: deleteAllAnalyses
      summary: Remove all persisted analyses that are tied to a log
      responses:
        "200":
          description: All persisted analyses deleted successfully
  /api/v1/rag/documents:
    post:
      tags: [RAG]
      operationId: createRagDocument
      summary: Create/index a document for retrieval (RAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRagDocumentRequest"
      responses:
        "201":
          description: Document accepted for indexing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagDocument"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /api/v1/rag/documents/{document_id}:
    delete:
      tags: [RAG]
      operationId: deleteRagDocument
      summary: Delete a previously indexed RAG document
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /api/v1/rag/delete_all:
    delete:
      tags: [RAG]
      operationId: deleteAllRagDocuments
      summary: Remove all documents from the RAG retrieval store
      responses:
        "200":
          description: All documents deleted successfully
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
  /api/v1/rag/search:
    post:
      tags: [RAG]
      operationId: searchRag
      summary: Search the retrieval store for relevant documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagSearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagSearchResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/logs:
    post:
      tags: [Ingestion]
      operationId: ingestLog
      summary: Ingest a deployment log event
      description: Accepts a deployment log event and publishes it asynchronously via RabbitMQ for processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingLogEventDto"
      responses:
        "202":
          description: Log event accepted for asynchronous processing
    get:
      tags: [Logbook]
      operationId: getDeploymentHistory
      summary: Get the historical deployment timeline
      responses:
        "200":
          description: List of historical deployment logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Log"

  /api/v1/logs/search:
    get:
      tags: [Logbook]
      operationId: getLogsByIds
      summary: Retrieve deployment logs matching a given list of UUIDs
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: Filtered list of logs by IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Log"

  /api/v1/incidents:
    get:
      tags: [Alerts]
      operationId: getIncidentStatuses
      summary: Retrieve a list of incident statuses, optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: "ACTIVE"
      responses:
        "200":
          description: A list of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentStatus"

  /api/v1/incidents/{logId}/status:
    patch:
      tags: [Alerts]
      operationId: updateStatus
      summary: Update the status of a specific incident
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateDto"
      responses:
        "200":
          description: Status successfully updated
        "404":
          description: Incident status not found

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, local_model_accelerated]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: py-intelligence
        local_model_accelerated:
          type: boolean
          description: True when this deployment runs the larger, accelerated local model tier.
        local_threads:
          type: integer
          nullable: true
          description: CPU threads available to the local model on this deployment, if resource-constrained.
        local_threads_recommended:
          type: integer
          nullable: true
          description: Recommended CPU threads for good local inference performance.
    AnalyzeRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: Raw log/text content to analyze.
        mode:
          type: string
          description: Which inference mode to use.
          enum: [local, cloud]
          default: local
        use_rag:
          type: boolean
          default: false
        context:
          type: string
          nullable: true
          description: Optional additional context from the caller.
        log_id:
          type: string
          nullable: true
          description: Log this analysis belongs to, if any. When set, the result is persisted and retrievable via /api/v1/analyses/query.
    AnalyzeResponse:
      type: object
      required: [problem_type, severity, summary, problem_summary, evidence, troubleshoot, solutions, confidence]
      properties:
        model:
          type: string
          description: Shortened name of the model that actually produced this result (e.g. Qwen, Gemini, GPT).
        problem_type:
          type: string
          description: UI tag/category of the detected problem.
          example: database_timeout
        severity:
          type: string
          description: Detected severity of the problem.
          example: Medium
        summary:
          type: string
          description: Short overall summary.
        problem_summary:
          type: string
          description: What went wrong / main issue.
        evidence:
          type: array
          items:
            type: string
          description: Evidence / hints parsed from logs.
        troubleshoot:
          type: array
          items:
            type: string
          description: Recommended troubleshooting/diagnostic steps.
        solutions:
          type: array
          items:
            type: string
          description: Suggested fixes / next steps.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
          description: Optional references used for RAG.
        confidence:
          type: string
          description: Confidence level of the analysis.
          example: Medium
    AnalysesQueryRequest:
      type: object
      required: [log_ids]
      properties:
        log_ids:
          type: array
          items:
            type: string
          description: Log IDs to fetch persisted analyses for.
    AnalysesQueryResponse:
      type: object
      description: Map of log_id to its persisted analysis. Log IDs with no stored analysis are omitted.
      additionalProperties:
        $ref: "#/components/schemas/AnalyzeResponse"
    SourceRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Source identifier (e.g., document id).
        title:
          type: string
        url:
          type: string
    CreateRagDocumentRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
          default: []
    RagDocument:
      type: object
      required: [id, title, content, tags]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
    RagSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
    RagSearchResponse:
      type: object
      required: [results, count]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/RagSearchResult"
        count:
          type: integer
          minimum: 0
    RagSearchResult:
      type: object
      required: [document_id, title, score, snippet]
      properties:
        document_id:
          type: string
        title:
          type: string
        score:
          type: number
          format: float
        snippet:
          type: string
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    IncomingLogEventDto:
      type: object
      required: [serviceName, logContent]
      properties:
        serviceName:
          type: string
          minLength: 1
          description: Name of the service that generated the deployment log
          example: auth-service
        logContent:
          type: string
          minLength: 1
          description: Raw deployment log content to be ingested
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: Optional timestamp of when the log was generated
        severity:
          type: string
          enum: [INFO, WARNING, ERROR, CRITICAL]
          default: INFO
          description: Log severity level
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional key-value metadata associated with the deployment
    Log:
      type: object
      description: Representation of a log entity from the logbook service
      properties:
        id:
          type: string
          format: uuid
        serviceName:
          type: string
        logContent:
          type: string
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
    IncidentStatus:
      type: object
      description: Represents the status of a parsed incident log
      properties:
        logId:
          type: string
          format: uuid
        status:
          type: string
          example: "ACTIVE"
    StatusUpdateDto:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: "RESOLVED"
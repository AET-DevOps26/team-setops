global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert.rules"

scrape_configs:
  - job_name: 'spring-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'spring-ingestion:8080'
          - 'spring-logbook:8080'
          - 'spring-alerts:8080'

  - job_name: 'py-intelligence'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'py-intelligence:8000'

apiVersion: 1

groups:
  - orgId: 1
    name: "System Alerts"
    folder: "DevPulse Alerts"
    interval: 10s
    rules:
      - uid: service_down_alert
        title: "Service Offline Alert"
        condition: C
        data:
          - refId: A
            datasourceUid: "prometheus-datasource"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: "up"
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: math
              expression: "$B < 1"
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Service {{ $labels.instance }} is offline!"
          description: "A container instance is unreachable and down."
        labels:
          severity: "critical"

      - uid: container_restart_alert
        title: "Container Restart Loop Alert"
        condition: C
        data:
          - refId: A
            datasourceUid: "prometheus-datasource"
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: 'increase(kube_pod_container_status_restarts_total{namespace="devpulse-prod"}[15m])'
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: math
              expression: "$B > 3"
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Container {{ $labels.container }} in Pod {{ $labels.pod }} is restarting frequently!"
          description: "A container is restarting frequently (more than 3 times in 15 minutes), indicating instability."
        labels:
          severity: "warning"

      - uid: container_oom_alert
        title: "Container OOM Killed Alert"
        condition: C
        data:
          - refId: A
            datasourceUid: "prometheus-datasource"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'kube_pod_container_status_terminated_reason{namespace="devpulse-prod", reason="OOMKilled"}'
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: math
              expression: "$B == 1"
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations:
          summary: "Container {{ $labels.container }} in Pod {{ $labels.pod }} was killed due to Out-Of-Memory (OOM)!"
          description: "A container was terminated with OOMKilled reason, meaning it exceeded its memory limit."
        labels:
          severity: "critical"

contactPoints:
  - orgId: 1
    name: "Telegram"
    receivers:
      - uid: telegram-contact-point
        type: telegram
        settings:
          bottoken: "${TELEGRAM_BOT_TOKEN}"
          chatid: "${TELEGRAM_CHAT_ID}"
          message: |
            {{ range .Alerts }}
            {{ if eq .Status "firing" }}🚨 <b>{{ if eq .Labels.alertname "Container OOM Killed Alert" }}CONTAINER OOM KILLED ALERT{{ else if eq .Labels.alertname "Container Restart Loop Alert" }}CONTAINER RESTART LOOP ALERT{{ else }}SYSTEM OFFLINE ALERT{{ end }}</b> 🚨
            
            {{ if .Labels.pod }}<b>Pod:</b> <code>{{ .Labels.pod }}</code> ({{ .Labels.container }})
            {{ else if .Labels.instance }}<b>Service:</b> <code>{{ .Labels.instance }}</code> ({{ .Labels.job }})
            {{ end }}<b>Summary:</b> {{ .Annotations.summary }}
            <b>Description:</b> {{ .Annotations.description }}
            <b>Severity:</b> {{ .Labels.severity }}
            
            ⚠️ <i>Immediate action required.</i>
            {{ else }}✅ <b>{{ if eq .Labels.alertname "Container OOM Killed Alert" }}OOM KILLED RESOLVED{{ else if eq .Labels.alertname "Container Restart Loop Alert" }}RESTART LOOP RESOLVED{{ else }}SYSTEM RECOVERED{{ end }}</b> ✅
            
            {{ if .Labels.pod }}<b>Pod:</b> <code>{{ .Labels.pod }}</code> ({{ .Labels.container }})
            {{ else if .Labels.instance }}<b>Service:</b> <code>{{ .Labels.instance }}</code> ({{ .Labels.job }})
            {{ end }}<b>Status:</b> Back online and healthy.
            
            🎉 <i>The issue has been resolved.</i>
            {{ end }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: "Telegram"
    group_by: ["alertname", "instance", "pod"]
    group_wait: 10s
    group_interval: 1m

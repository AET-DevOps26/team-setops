server:
  port: 8080

spring:
  application:
    name: spring-logbook
  
  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates the tables on startup
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # RabbitMQ Configuration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

# Custom DevPulse RabbitMQ bindings
devpulse:
  rabbitmq:
    exchange: devpulse.exchange
    queue:
      deployment-logs: devpulse.logs.deployment.queue
    routing-key:
      deployment-logs: log.deployment.received
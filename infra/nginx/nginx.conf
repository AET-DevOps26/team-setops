events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security: Hide Nginx version
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Connection Timeouts
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Proxy Connection & Read Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 60s; # Higher timeout for Python GenAI inference tasks

    # Request Body Size Limit (10MB)
    client_max_body_size 10M;

    # Enable logging to stdout and stderr for Docker observability
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Origin Whitelist Map for CORS
    map $http_origin $allow_origin {
        default "";
        "http://localhost:3000" "http://localhost:3000";
        "http://127.0.0.1:3000" "http://127.0.0.1:3000";
        "http://localhost:8080" "http://localhost:8080";
        "http://127.0.0.1:8080" "http://127.0.0.1:8080";
    }

    server {
        listen 80;
        
        # Docker internal DNS resolver
        resolver 127.0.0.11 valid=5s;

        # 1. Routing to Spring Ingestion service & Logbook service (Logs)
        location /api/v1/logs {
            include cors.conf;

            set $backend http://spring-ingestion:8080;
            if ($request_method = GET) {
                set $backend http://spring-logbook:8080;
            }
            if ($request_method = DELETE) {
                set $backend http://spring-logbook:8080;
            }
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Routing to Spring Ingestion service (Alerts)
        location /api/v1/alerts/system {
            include cors.conf;

            set $ingestion_backend http://spring-ingestion:8080;
            proxy_pass $ingestion_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Routing to Spring Logbook service
        location /api/v1/logbook {
            include cors.conf;

            set $logbook_backend http://spring-logbook:8080;
            proxy_pass $logbook_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Routing to Spring Alerts service
        location /api/v1/alerts {
            include cors.conf;

            set $alerts_backend http://spring-alerts:8080;
            proxy_pass $alerts_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4b. Routing to Spring Alerts service (Incidents)
        location /api/v1/incidents {
            include cors.conf;

            set $alerts_backend http://spring-alerts:8080;
            proxy_pass $alerts_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4c. Routing to Spring Logbook service (Metrics)
        location /api/v1/metrics {
            include cors.conf;

            set $logbook_backend http://spring-logbook:8080;
            proxy_pass $logbook_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Routing to Python Intelligence service (Analyze)
        location /api/v1/analyze {
            include cors.conf;

            set $py_intel_backend http://py-intelligence:8000;
            proxy_pass $py_intel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # LLM calls can retry against Gemini before falling back to OpenAI,
            # which routinely exceeds the default 60s read timeout.
            proxy_read_timeout 180s;
        }

        # 6. Routing to Python Intelligence service (RAG)
        location /api/v1/rag {
            include cors.conf;

            set $py_intel_backend http://py-intelligence:8000;
            proxy_pass $py_intel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        # 7. Routing to Python Intelligence service (Health)
        location /health {
            include cors.conf;

            set $py_intel_backend http://py-intelligence:8000;
            proxy_pass $py_intel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 8. Routing to Frontend (React/Vite Dev Server)
        location / {
            set $client_backend http://client:3000;
            proxy_pass $client_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

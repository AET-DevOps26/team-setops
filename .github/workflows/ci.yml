name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

jobs:
  spring-services:
    name: Spring services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        serviceDir:
          - services/spring-alerts
          - services/spring-ingestion
          - services/spring-logbook
    defaults:
      run:
        working-directory: ${{ matrix.serviceDir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 21) and Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: "gradle"

      - name: Run Gradle clean, tests and build
        run: ./gradlew :app:clean :app:test :app:build --no-daemon --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.serviceDir }}
          path: app/build/test-results/**

  py-intelligence:
    name: py-intelligence (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/py-intelligence
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/py-intelligence/requirements.txt
            services/py-intelligence/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Black (format check)
        run: black --check .

      - name: Flake8 (lint)
        run: flake8 .

      - name: Pytest
        run: pytest
        env:
          MONGODB_URI: mongodb://localhost:27017
          DB_NAME: test_db
          COLLECTION_NAME: test_collection

  client:
    name: Client (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests (one-shot)
        run: npm run test -- --run

      - name: Build
        run: npm run build

  docker-checks:
    name: Docker build checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: client
            context: client
            dockerfile: client/Dockerfile
            image: client
          - name: py-intelligence
            context: services/py-intelligence
            dockerfile: services/py-intelligence/Dockerfile
            image: py-intelligence
          - name: spring-alerts
            context: services/spring-alerts
            dockerfile: services/spring-alerts/Dockerfile
            image: spring-alerts
          - name: spring-ingestion
            context: services/spring-ingestion
            dockerfile: services/spring-ingestion/Dockerfile
            image: spring-ingestion
          - name: spring-logbook
            context: services/spring-logbook
            dockerfile: services/spring-logbook/Dockerfile
            image: spring-logbook
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose -f infra/docker-compose.yml config

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: local/${{ matrix.image }}:ci
